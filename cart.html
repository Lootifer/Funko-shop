<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Assets/Js/bootstrap-preferences.js"></script>
    <title>Winkelwagen | 2nd Life Toys</title>
    <link rel="stylesheet" href="Assets/Css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="headerRoot"></div>

    <main class="cart-page">
      <section class="section-heading">
        <p class="eyebrow">Winkelwagen</p>
        <h1>Controleer je selectie.</h1>
        <p class="hero-text">Pas aantallen aan, verwijder items en ga door naar de aanvraag voor afrekening.</p>
      </section>

      <section class="cart-layout">
        <article class="cart-panel">
          <div id="cartItems"></div>
        </article>

        <aside class="cart-panel order-summary-card">
          <h2>Samenvatting</h2>
          <p class="order-summary-meta" id="cartMeta">0 artikelen</p>
          <div id="cartSummary"></div>
          <div class="cart-actions">
            <a class="button secondary" href="shop.html">Verder winkelen</a>
            <a class="button primary" href="checkout.html">Afrekenen</a>
          </div>
          <p class="checkout-notice">Dit is nog geen directe betaling. Je rondt hier een orderaanvraag af tot er een betaalprovider is gekoppeld.</p>
        </aside>
      </section>
    </main>

    <div id="footerRoot"></div>

    <script type="module" src="Assets/Js/cart.js"></script>
  </body>
</html>
