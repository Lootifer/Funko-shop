<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Assets/Js/bootstrap-preferences.js"></script>
    <title>Collectibles Sale &amp; Deals | 2nd Life Toys</title>
        <meta name="description" content="Discover reduced collectibles at 2nd Life Toys, with temporary deals on selected new and pre-owned collectible items." />
    <link rel="canonical" href="https://www.2ndlifetoys.nl/sale.html" />
    <link rel="stylesheet" href="Assets/Css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="category-world category-world--sale" data-collection-key="sale" data-curated-grid="true">
    <div id="headerRoot"></div>

    <main class="product-page category-world-page reveal">
      <section class="section-heading category-hero category-hero--sale">
        <div class="category-hero-copy">
          <p class="eyebrow">Sale</p>
          <h1>Collectibles at a lower price.</h1>
          <p class="hero-text">Browse products with a valid reduced price.</p>
          <div class="category-hero-chips" aria-label="Collection information">
            <span id="categorySpotLabel">16 display spots</span>
            <span id="categoryAdminLabel">Filled automatically from Admin</span>
          </div>
        </div>
        <div class="category-hero-visual">
          <div class="sale-stage" aria-hidden="true"><span class="sale-ticket ticket-a"></span><span class="sale-ticket ticket-b"></span><span class="sale-ribbon ribbon-a"></span><span class="sale-ribbon ribbon-b"></span><span class="sale-burst burst-a"></span><span class="sale-burst burst-b"></span></div>
        </div>
      </section>

      <section class="category-collection-shell" aria-labelledby="categoryShelfTitle">
        <div class="category-grid-heading">
          <div>
            <p class="category-kicker" id="categoryShelfKicker">THE GOLDEN DROP</p>
            <h2 id="categoryShelfTitle">Limited offers. Lasting stories.</h2>
            <p class="category-shelf-text" id="categoryShelfText">Sixteen clear positions for every product with a valid discount price.</p>
            <p class="shop-count" id="shopCount">Products are loading…</p>
          </div>
          <label class="category-sort-control" for="shopSort">
            <span id="categorySortLabel">Arrange the shelf</span>
            <select id="shopSort">
              <option value="newest">Newest</option>
              <option value="price-asc">Price low to high</option>
              <option value="price-desc">Price high to low</option>
              <option value="alpha">Alphabetical</option>
            </select>
          </label>
        </div>

        <div class="card-grid category-product-grid" id="shopGrid"></div>
        <div class="pagination category-pagination" id="shopPagination"></div>
      </section>
    </main>

    <div id="footerRoot"></div>
    <script type="module" src="Assets/Js/shop.js"></script>
  </body>
</html>
