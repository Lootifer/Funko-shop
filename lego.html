<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Assets/Js/bootstrap-preferences.js"></script>
    <title>LEGO shop | Lootifer Collectibles</title>
    <meta name="description" content="Browse LEGO collectibles from the Lootifer private collection." />
    <link rel="stylesheet" href="Assets/Css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="category-world category-world--lego" data-collection-key="lego" data-curated-grid="true">
    <div id="headerRoot"></div>

    <main class="product-page category-world-page reveal">
      <section class="section-heading category-hero category-hero--lego">
        <div class="category-hero-copy">
          <p class="eyebrow">LEGO</p>
          <h1>Build, play and collect.</h1>
          <p class="hero-text">Discover LEGO collectibles from the private collection.</p>
          <div class="category-hero-chips" aria-label="Collection information">
            <span id="categorySpotLabel"></span>
            <span id="categoryAdminLabel"></span>
          </div>
        </div>
        <div class="category-hero-visual">
          <div class="builder-stage" aria-hidden="true"><span class="brick brick-a"></span><span class="brick brick-b"></span><span class="brick brick-c"></span><span class="brick brick-d"></span><span class="brick brick-e"></span><span class="builder-glow"></span></div>
        </div>
      </section>

      <section class="category-collection-shell" aria-labelledby="categoryShelfTitle">
        <div class="category-grid-heading">
          <div>
            <p class="category-kicker" id="categoryShelfKicker">THE BUILDER'S SHELF</p>
            <h2 id="categoryShelfTitle">Ready to build your collection?</h2>
            <p class="category-shelf-text" id="categoryShelfText"></p>
            <p class="shop-count" id="shopCount">Products are loading…</p>
          </div>
          <label class="category-sort-control" for="shopSort">
            <span id="categorySortLabel">Arrange the shelf</span>
            <select id="shopSort">
              <option value="newest">Newest</option>
              <option value="price-asc">Price low to high</option>
              <option value="price-desc">Price high to low</option>
              <option value="alpha">Alphabetical</option>
            </select>
          </label>
        </div>

        <div class="card-grid category-product-grid" id="shopGrid"></div>
        <div class="pagination category-pagination" id="shopPagination"></div>
      </section>
    </main>

    <div id="footerRoot"></div>
    <script type="module" src="Assets/Js/shop.js"></script>
  </body>
</html>
