<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage | Lootifer Admin</title>
    <link rel="stylesheet" href="../Assets/Css/main.css" />
    <link rel="stylesheet" href="assets/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <div id="adminSidebar"></div>
      <main class="admin-main">
        <div id="adminTopbar"></div>

        <section class="admin-section">
          <div class="admin-card">
            <p class="admin-label">Homepage vitrines</p>
            <h3>Twee vitrines met zes producten</h3>
            <p class="admin-detail">
              Vak 1, 2 en 3 vormen de eerste vitrine. Vak 4, 5 en 6 vormen de tweede vitrine.
              Kies per vak een product; de productfoto wordt automatisch gebruikt.
              Met “Kies andere foto” kun je optioneel een eigen JPG/PNG/WebP tonen.
            </p>
            <div class="admin-home-grid admin-home-grid-six" id="highlightManager"></div>
            <div class="admin-form-actions">
              <button class="button primary" type="button" id="saveHighlightsButton">Vitrines opslaan</button>
            </div>
            <p class="admin-detail" id="highlightStatus"></p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="assets/homepage-admin.js"></script>
  </body>
</html>
