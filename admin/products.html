<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | Lootifer Admin</title>
    <link rel="stylesheet" href="../Assets/Css/main.css" />
    <link rel="stylesheet" href="assets/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <div id="adminSidebar"></div>
      <main class="admin-main">
        <div id="adminTopbar"></div>

        <section class="admin-section">
          <div class="admin-card">
            <h3><span id="formModeLabel">Add Product</span></h3>
            <p class="admin-detail" id="productStatus">Loading product catalog...</p>
            <div class="admin-error" id="productErrors" style="display: none;"></div>

            <form id="productForm">
              <div class="admin-form-grid">
                <label>
                  ID
                  <input id="fieldId" type="number" placeholder="Auto-generated" disabled />
                </label>
                <label>
                  Name *
                  <input id="fieldName" placeholder="Collector figure name" required />
                </label>
                <label>
                  Number
                  <input id="fieldNumber" placeholder="e.g. #593" />
                </label>
                <label>
                  Slug *
                  <div class="admin-inline-controls">
                    <input id="fieldSlug" placeholder="auto-generated" required />
                    <button class="button secondary" type="button" id="resetSlugButton">Auto</button>
                  </div>
                </label>
                <label>
                  SKU *
                  <input id="fieldSku" placeholder="FP-DC-593" required />
                </label>
                <label>
                  Barcode
                  <input id="fieldBarcode" placeholder="UPC/EAN" />
                </label>
                <label>
                  Category *
                  <input id="fieldCategory" value="Funko Pop" required />
                </label>
                <label>
                  Brand *
                  <input id="fieldBrand" value="Funko" required />
                </label>
                <label>
                  Universe *
                  <input id="fieldUniverse" placeholder="DC, Marvel, Pokemon" required />
                </label>
                <label>
                  Franchise *
                  <input id="fieldFranchise" placeholder="Batman" required />
                </label>
                <label>
                  Edition
                  <input id="fieldEdition" value="Standard" />
                </label>
                <label>
                  Variant
                  <input id="fieldVariant" value="Standard" />
                </label>
                <label>
                  Release Year
                  <input id="fieldReleaseYear" type="number" value="2026" />
                </label>
                <label>
                  Condition
                  <input id="fieldCondition" value="Mint" />
                </label>
                <label>
                  Box Condition
                  <input id="fieldBoxCondition" value="Mint" />
                </label>
                <label>
                  Warehouse Location
                  <input id="fieldWarehouseLocation" placeholder="WH-DC-593" />
                </label>
                <label>
                  Purchase Price
                  <input id="fieldPurchasePrice" type="number" step="0.01" value="0" />
                </label>
                <label>
                  Selling Price *
                  <input id="fieldSellingPrice" type="number" step="0.01" value="0" required />
                </label>
                <label>
                  Discount Price
                  <input id="fieldDiscountPrice" type="number" step="0.01" />
                </label>
                <label>
                  Stock *
                  <input id="fieldStock" type="number" value="0" required />
                </label>
                <label>
                  Reserved
                  <input id="fieldReserved" type="number" value="0" />
                </label>
                <label>
                  Tags
                  <input id="fieldTags" placeholder="exclusive, dc, batman" />
                </label>
                <label class="admin-grid-wide">
                  Description
                  <textarea id="fieldDescription" rows="3" placeholder="Short collector-facing description."></textarea>
                </label>
                <label class="admin-grid-wide">
                  Images (one per line)
                  <textarea id="fieldImages" rows="5" placeholder="Assets/Images/Products/funko/your-slug/front.webp"></textarea>
                </label>
              </div>

              <div class="admin-check-grid">
                <label><input id="fieldExclusive" type="checkbox" /> Exclusive</label>
                <label><input id="fieldChase" type="checkbox" /> Chase</label>
                <label><input id="fieldVaulted" type="checkbox" /> Vaulted</label>
                <label><input id="fieldSigned" type="checkbox" /> Signed</label>
                <label><input id="fieldProtectorIncluded" type="checkbox" /> Protector Included</label>
              </div>

              <div class="admin-form-actions">
                <button class="button secondary" type="button" id="autoLinkImagesButton">Auto Link Images</button>
                <button class="button secondary" type="button" id="cancelEditButton" style="display: none;">Cancel Edit</button>
                <button class="button secondary" type="button" id="resetCatalogButton">Reset Local Changes</button>
                <button class="button primary" type="submit" id="saveProductButton">Save Product</button>
              </div>
              <p class="admin-detail" id="imageSourceHint">Images: manual list or auto-linked by slug.</p>
            </form>
          </div>
        </section>

        <section class="admin-section">
          <div class="admin-card">
            <h3>Live Preview</h3>
            <p class="admin-detail">Preview reflects current form values before save.</p>
            <div id="productLivePreview"></div>
          </div>
        </section>

        <section class="admin-section">
          <div id="productTable"></div>
        </section>
      </main>
    </div>

    <script type="module" src="assets/products-admin.js"></script>
  </body>
</html>
