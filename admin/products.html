<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | Lootifer Admin</title>
    <link rel="stylesheet" href="../Assets/Css/main.css" />
    <link rel="stylesheet" href="assets/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <div id="adminSidebar"></div>
      <main class="admin-main">
        <div id="adminTopbar"></div>

        <section class="admin-section">
          <div class="admin-card">
            <h3>+ Add Product</h3>
            <div class="admin-form-grid">
              <label>
                Name
                <input placeholder="Collector figure name" />
              </label>
              <label>
                Number
                <input placeholder="e.g. 593" />
              </label>
              <label>
                Universe
                <input placeholder="DC, Marvel, Pokémon..." />
              </label>
              <label>
                Price
                <input type="number" value="89" />
              </label>
              <label>
                Exclusive
                <select>
                  <option>No</option>
                  <option>Yes</option>
                </select>
              </label>
              <label>
                Chase
                <select>
                  <option>No</option>
                  <option>Yes</option>
                </select>
              </label>
              <label>
                Vaulted
                <select>
                  <option>No</option>
                  <option>Yes</option>
                </select>
              </label>
              <label>
                Stock
                <input type="number" value="8" />
              </label>
              <label>
                Upload Images
                <input type="file" multiple />
              </label>
              <label>
                Save
                <button class="button primary" type="button">Save</button>
              </label>
            </div>
          </div>
        </section>

        <section class="admin-section">
          <div id="productTable"></div>
        </section>
      </main>
    </div>

    <script type="module">
      import { createAdminSidebar, createAdminTopbar, createTable } from './components/layout.js';
      document.getElementById('adminSidebar').innerHTML = createAdminSidebar('products');
      document.getElementById('adminTopbar').innerHTML = createAdminTopbar('Products');
      document.getElementById('productTable').innerHTML = createTable(
        ['Name', 'Universe', 'Stock', 'Status'],
        [
          ['Midnight Viper', 'DC', '6', 'Live'],
          ['Aurora Guardian', 'Marvel', '3', 'Low Stock'],
          ['Snow Queen', 'Disney', '8', 'Featured'],
        ]
      );
    </script>
  </body>
</html>
