<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Producten | Lootifer Admin</title>
    <link rel="stylesheet" href="../Assets/Css/main.css" />
    <link rel="stylesheet" href="assets/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <div id="adminSidebar"></div>
      <main class="admin-main">
        <div id="adminTopbar"></div>

        <section class="admin-section">
          <div class="admin-card">
            <h3><span id="formModeLabel">Product toevoegen</span></h3>
            <p class="admin-detail" id="productStatus">Productcatalogus wordt geladen...</p>
            <div class="admin-error" id="productErrors" style="display: none;"></div>

            <div class="admin-toolbar">
              <button class="button secondary" type="button" id="exportCatalogButton">Exporteer products.json</button>
              <button class="button secondary" type="button" id="importCatalogButton">Importeer JSON</button>
              <input id="importCatalogInput" type="file" accept="application/json" hidden />
              <button class="button secondary" type="button" id="resetCatalogButton">Lokale wijzigingen resetten</button>
            </div>

            <div class="admin-import-preview" id="importPreview" style="display: none;"></div>

            <div class="admin-overview-stats" id="productCompletenessStats"></div>

            <form id="productForm">
              <div class="admin-form-grid">
                <label>
                  ID
                  <input id="fieldId" type="number" placeholder="Automatisch" required />
                </label>
                <label>
                  Naam *
                  <input id="fieldName" placeholder="Naam van het product" required />
                </label>
                <label>
                  Nummer
                  <input id="fieldNumber" placeholder="bijv. #593" />
                </label>
                <label>
                  Slug *
                  <div class="admin-inline-controls">
                    <input id="fieldSlug" placeholder="automatisch" required />
                    <button class="button secondary" type="button" id="resetSlugButton">Genereer</button>
                  </div>
                </label>
                <label>
                  SKU *
                  <input id="fieldSku" placeholder="FP-DC-593" required />
                </label>
                <label>
                  Barcode
                  <input id="fieldBarcode" placeholder="EAN/UPC" />
                </label>
                <label>
                  Categorie *
                  <input id="fieldCategory" value="Funko Pop" required />
                </label>
                <label>
                  Merk *
                  <input id="fieldBrand" value="Funko" required />
                </label>
                <label>
                  Universum *
                  <input id="fieldUniverse" placeholder="DC, Marvel, Pokémon" required />
                </label>
                <label>
                  Franchise *
                  <input id="fieldFranchise" placeholder="Batman" required />
                </label>
                <label>
                  Editie
                  <input id="fieldEdition" value="Standard" />
                </label>
                <label>
                  Variant
                  <input id="fieldVariant" value="Standard" />
                </label>
                <label>
                  Uitgavejaar
                  <input id="fieldReleaseYear" type="number" value="2026" />
                </label>
                <label>
                  Staat
                  <input id="fieldCondition" value="Mint" />
                </label>
                <label>
                  Staat doos
                  <input id="fieldBoxCondition" value="Mint" />
                </label>
                <label>
                  Magazijnlocatie
                  <input id="fieldWarehouseLocation" placeholder="WH-DC-593" />
                </label>
                <label>
                  Inkoopprijs
                  <input id="fieldPurchasePrice" type="number" step="0.01" value="0" />
                </label>
                <label>
                  Verkoopprijs *
                  <input id="fieldSellingPrice" type="number" step="0.01" value="0" required />
                </label>
                <label>
                  Actieprijs
                  <input id="fieldDiscountPrice" type="number" step="0.01" />
                </label>
                <label>
                  Voorraad *
                  <input id="fieldStock" type="number" value="0" required />
                </label>
                <label>
                  Gereserveerd (alleen admin)
                  <input id="fieldReserved" type="number" value="0" />
                </label>
                <label>
                  Tags
                  <input id="fieldTags" placeholder="exclusive, dc, batman" />
                </label>
                <label class="admin-grid-wide">
                  Beschrijving
                  <textarea id="fieldDescription" rows="3" placeholder="Korte productbeschrijving voor de winkel."></textarea>
                </label>
                <label class="admin-grid-wide">
                  Afbeeldingen (een per regel)
                  <textarea id="fieldImages" rows="5" placeholder="Assets/Images/Products/funko/your-slug/front.webp"></textarea>
                </label>
              </div>

              <div class="admin-check-grid">
                <label><input id="fieldExclusive" type="checkbox" /> Exclusive</label>
                <label><input id="fieldChase" type="checkbox" /> Chase</label>
                <label><input id="fieldVaulted" type="checkbox" /> Vaulted</label>
                <label><input id="fieldSigned" type="checkbox" /> Gesigneerd</label>
                <label><input id="fieldProtectorIncluded" type="checkbox" /> Protector inbegrepen</label>
              </div>

              <div class="admin-canonical-preview" id="canonicalImageHint"></div>

              <div class="admin-form-actions">
                <button class="button secondary" type="button" id="autoLinkImagesButton">Afbeeldingen koppelen</button>
                <button class="button secondary" type="button" id="cancelEditButton" style="display: none;">Bewerken annuleren</button>
                <button class="button primary" type="submit" id="saveProductButton">Product opslaan</button>
              </div>
              <p class="admin-detail" id="imageSourceHint">Afbeeldingen: handmatig invoeren of automatisch koppelen via slug.</p>
            </form>
          </div>
        </section>

        <section class="admin-section">
          <div class="admin-card">
            <h3>Live preview</h3>
            <p class="admin-detail">Preview toont direct hoe de productkaart eruitziet vóór opslaan.</p>
            <div id="productLivePreview"></div>
          </div>
        </section>

        <section class="admin-section">
          <div class="admin-card">
            <h3>Productoverzicht</h3>
            <div class="admin-filters-grid">
              <label>
                Zoeken
                <input id="tableSearch" type="text" placeholder="Zoek op naam, slug, SKU of barcode" />
              </label>
              <label>
                Universum
                <select id="tableUniverseFilter"><option value="">Alle universums</option></select>
              </label>
              <label>
                Franchise
                <select id="tableFranchiseFilter"><option value="">Alle franchises</option></select>
              </label>
              <label>
                Voorraadstatus
                <select id="tableStockFilter">
                  <option value="">Alles</option>
                  <option value="in-stock">Op voorraad</option>
                  <option value="low-stock">Lage voorraad (≤2)</option>
                  <option value="out-of-stock">Niet op voorraad</option>
                </select>
              </label>
              <label>
                Ontbrekende info
                <select id="tableMissingFilter">
                  <option value="">Geen filter</option>
                  <option value="any">Heeft ontbrekende gegevens</option>
                  <option value="price">Mist prijs</option>
                  <option value="barcode">Mist barcode</option>
                  <option value="releaseYear">Mist uitgavejaar</option>
                  <option value="description">Mist beschrijving</option>
                  <option value="photos">Mist foto's</option>
                </select>
              </label>
              <label>
                Productstatus
                <select id="tableArchiveFilter">
                  <option value="active">Actief</option>
                  <option value="archived">Gearchiveerd</option>
                  <option value="all">Alles</option>
                </select>
              </label>
            </div>
            <p class="admin-detail" id="tableResultHint"></p>
          </div>
          <div id="productTable"></div>
        </section>
      </main>
    </div>

    <script type="module" src="assets/products-admin.js"></script>
  </body>
</html>
