<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="Assets/Js/bootstrap-preferences.js"></script>

    <title>Pokémon Kaarten & Verzamelitems | 2nd Life Toys</title>

    <meta
      name="description"
      content="Bekijk nieuwe en tweedehands Pokémon kaarten en verzamelitems bij 2nd Life Toys, waaronder Pokémon TCG, holo, reverse holo, EX, V, VMAX, VSTAR en promo kaarten."
    />

    <link rel="canonical" href="https://www.2ndlifetoys.nl/pokemon.html" />

    <link rel="stylesheet" href="Assets/Css/main.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Pokémon pagina */

      body.category-world--pokemon .category-hero {
        grid-template-columns: 1fr !important;
        min-height: 0 !important;
        padding: clamp(1.45rem, 3vw, 2.35rem) !important;
        margin-bottom: 1rem !important;
      }

      body.category-world--pokemon .category-hero-visual {
        display: none !important;
      }

      body.category-world--pokemon .category-hero::before,
      body.category-world--pokemon .category-hero::after,
      body.category-world--pokemon .category-collection-shell::before,
      body.category-world--pokemon .category-collection-shell::after,
      body.category-world--pokemon .category-product-grid::before,
      body.category-world--pokemon .category-product-grid::after,
      body.category-world--pokemon #shopGrid::before,
      body.category-world--pokemon #shopGrid::after {
        content: none !important;
        display: none !important;
      }

      body.category-world--pokemon .category-collection-shell {
        display: block !important;
        min-height: 0 !important;
        height: auto !important;
        margin-top: 0 !important;
        padding: clamp(1rem, 2.3vw, 1.65rem) !important;
        overflow: visible !important;
        border-radius: 1.55rem !important;

        background:
          radial-gradient(
            circle at 92% 0%,
            rgba(255, 214, 70, 0.085),
            transparent 24rem
          ),
          color-mix(in srgb, var(--surface) 88%, transparent) !important;
      }

      /*
        Geen tweede zoekbalk op de Pokémon-pagina.
        De kaartsoort-knoppen worden gebruikt voor snel filteren.
      */
      body.category-world--pokemon .category-search-toolbar {
        display: none !important;
      }

      .pokemon-assortment-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .pokemon-assortment-title p {
        margin: 0 0 0.28rem;
        color: #f0c63b;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .pokemon-assortment-title h2 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.35rem);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .pokemon-assortment-title .shop-count {
        margin: 0.55rem 0 0;
        color: rgba(255, 255, 255, 0.68);
        font-size: 0.92rem;
      }

      .pokemon-assortment-sort {
        display: grid;
        gap: 0.38rem;
        min-width: 220px;
        color: rgba(255, 255, 255, 0.62);
        font-size: 0.76rem;
        font-weight: 700;
      }

      .pokemon-assortment-sort select {
        min-height: 46px;
        padding: 0.65rem 2.5rem 0.65rem 1rem;

        border: 1px solid rgba(240, 198, 59, 0.3);
        border-radius: 999px;

        background: rgba(255, 255, 255, 0.055);
        color: var(--text);

        font: inherit;
        font-weight: 700;
      }

      /* Pokémon snelknoppen */

      .pokemon-quick-filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;

        gap: 0.62rem;

        margin: 0 0 1.2rem;
        padding: 0.95rem;

        border: 1px solid rgba(240, 198, 59, 0.18);
        border-radius: 1.15rem;

        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.035),
            rgba(0, 0, 0, 0.1)
          );

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.055),
          0 14px 30px rgba(0, 0, 0, 0.12);
      }

      .pokemon-quick-label {
        width: 100%;
        margin: 0 0 0.15rem;

        color: rgba(255, 255, 255, 0.62);

        font-size: 0.76rem;
        font-weight: 800;

        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .pokemon-quick-filter {
        appearance: none;

        min-height: 40px;

        padding: 0.62rem 1.02rem;

        border: 1px solid rgba(237, 191, 45, 0.45);
        border-radius: 999px;

        background:
          linear-gradient(
            180deg,
            rgba(67, 54, 21, 0.96),
            rgba(39, 32, 15, 0.96)
          );

        color: #efc945;

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.09),
          0 7px 16px rgba(0, 0, 0, 0.18);

        font: inherit;
        font-size: 0.82rem;
        font-weight: 800;

        letter-spacing: 0.025em;

        cursor: pointer;

        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          box-shadow 0.16s ease,
          color 0.16s ease,
          background 0.16s ease;
      }

      .pokemon-quick-filter:hover,
      .pokemon-quick-filter:focus-visible {
        transform: translateY(-2px);

        border-color: rgba(255, 213, 70, 0.92);

        color: #ffe16b;

        outline: none;
      }

      /*
        Geselecteerde knop.
        Deze blijft geel nadat erop geklikt is.
      */

      .pokemon-quick-filter.is-active {
        color: #171207;

        border-color: #f4cf48;

        background:
          linear-gradient(
            180deg,
            #f5d45a 0%,
            #d9a91f 100%
          );

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.48),
          0 7px 0 #8b6911,
          0 14px 24px rgba(0, 0, 0, 0.18);

        transform: translateY(-2px);
      }

      body.category-world--pokemon .category-product-grid,
      body.category-world--pokemon #shopGrid {
        min-height: 0 !important;
        height: auto !important;

        margin-top: 0.15rem !important;

        align-items: start !important;
      }

      body.category-world--pokemon #shopGrid:empty {
        min-height: 0 !important;
        height: 0 !important;
      }

      @media (max-width: 760px) {
        .pokemon-assortment-head {
          align-items: stretch;
          flex-direction: column;
        }

        .pokemon-assortment-sort {
          width: 100%;
          min-width: 0;
        }

        .pokemon-quick-filters {
          gap: 0.5rem;
          padding: 0.8rem;
        }

        .pokemon-quick-filter {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>

  <body
    class="category-world category-world--pokemon"
    data-collection-key="pokemon"
    data-curated-grid="true"
  >

    <div id="headerRoot"></div>

    <main class="product-page category-world-page reveal">

      <!-- BOVENSTE POKÉMON BLOK -->

      <section
        class="section-heading category-hero category-hero--pokemon"
      >

        <div class="category-hero-copy">

          <p class="eyebrow">
            Pokémon
          </p>

          <h1>
            Voor trainers en verzamelaars.
          </h1>

          <p class="hero-text">
            Ontdek Pokémon kaarten en verzamelitems uit mijn privécollectie.
          </p>

        </div>

      </section>


      <!-- ASSORTIMENT -->

      <section
        class="category-collection-shell pokemon-assortment-shell"
        aria-labelledby="pokemonAssortmentTitle"
      >

        <div class="pokemon-assortment-head">

          <div class="pokemon-assortment-title">

            <p>
              Pokémon TCG
            </p>

            <h2 id="pokemonAssortmentTitle">
              Kies je volgende ontdekking.
            </h2>

            <p
              class="shop-count"
              id="shopCount"
            >
              Producten worden geladen…
            </p>

          </div>


          <!-- SORTERING -->

          <label
            class="pokemon-assortment-sort"
            for="shopSort"
          >

            <span>
              Sorteren
            </span>

            <select id="shopSort">

              <option value="newest">
                Nieuwste
              </option>

              <option value="price-asc">
                Prijs laag naar hoog
              </option>

              <option value="price-desc">
                Prijs hoog naar laag
              </option>

              <option value="alpha">
                Alfabetisch
              </option>

            </select>

          </label>

        </div>


        <!-- SNEL NAAR KAARTSOORT -->

        <div
          class="pokemon-quick-filters"
          id="pokemonQuickFilters"
          aria-label="Pokémon kaartsoorten"
        >

          <span class="pokemon-quick-label">
            Snel naar kaartsoort
          </span>


          <button
            class="pokemon-quick-filter is-active"
            type="button"
            data-pokemon-filter="all"
            aria-pressed="true"
          >
            Alle kaarten
          </button>


          <button
            class="pokemon-quick-filter"
            type="button"
            data-pokemon-filter="pokemon"
            aria-pressed="false"
          >
            Pokémon
          </button>


          <button
            class="pokemon-quick-filter"
            type="button"
            data-pokemon-filter="energy"
            aria-pressed="false"
          >
            Energie
          </button>


          <button
            class="pokemon-quick-filter"
            type="button"
            data-pokemon-filter="trainer"
            aria-pressed="false"
          >
            Trainers
          </button>


          <button
            class="pokemon-quick-filter"
            type="button"
            data-pokemon-filter="holo-reverse"
            aria-pressed="false"
          >
            Holo / Reverse
          </button>


          <button
            class="pokemon-quick-filter"
            type="button"
            data-pokemon-filter="v-ex"
            aria-pressed="false"
          >
            V / EX
          </button>


          <button
            class="pokemon-quick-filter"
            type="button"
            data-pokemon-filter="vmax-vstar"
            aria-pressed="false"
          >
            VMAX / VSTAR
          </button>


          <button
            class="pokemon-quick-filter"
            type="button"
            data-pokemon-filter="promo"
            aria-pressed="false"
          >
            Promo
          </button>

        </div>


        <!-- PRODUCTEN -->

        <div
          class="card-grid category-product-grid"
          id="shopGrid"
        ></div>


        <!-- PAGINERING -->

        <div
          class="pagination category-pagination"
          id="shopPagination"
        ></div>

      </section>

    </main>


    <div id="footerRoot"></div>


    <!--
      Nieuwe versietag voorkomt dat de browser
      een oude shop.js uit de cache gebruikt.
    -->

    <script
      type="module"
      src="Assets/Js/shop.js?v=20260829-2"
    ></script>

  </body>
</html>
